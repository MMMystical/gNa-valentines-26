<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🩵 For Alan 🤍</title>
<link rel="icon" type="image/png" href="favicon.ico">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: linear-gradient(135deg, #ff6fae, #ff3f6c);
  min-height: 100vh;
  overflow-x: hidden;
  color: white;
  text-align: center;
}

/* Floating hearts */
.heart {
  position: fixed;
  bottom: -20px;
  font-size: 20px;
  animation: floatUp linear infinite;
  opacity: 0.8;
  pointer-events: none;
}

@keyframes floatUp {
  from {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  to {
    transform: translateY(-120vh) scale(1.5);
    opacity: 0;
  }
}

/* Layout */
.container {
  padding: 40px 15px;
}

.name {
  font-size: clamp(2.5rem, 6vw, 3.8rem);
  color: #7fd7ff;
  text-shadow: 0 0 10px #7fd7ff, 0 0 25px #7fd7ff;
  margin-bottom: 10px;
}

.countdown {
  font-size: 1.05rem;
  margin-bottom: 18px;
  color: #e9f9ff;
  text-shadow: 0 0 8px rgba(255,255,255,0.6);
}

/* Photo */
.photo {
  width: 180px;
  height: 180px;
  margin: 0 auto 20px;
  border-radius: 22px;
  overflow: hidden;
  border: 3px solid rgba(255,255,255,0.4);
  box-shadow: 0 0 20px rgba(255,255,255,0.25);
  animation: floatPic 3s ease-in-out infinite;
  cursor: pointer;
  position: relative;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

@keyframes floatPic {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* Photo message */
.photo-message {
  margin-top: 10px;
  font-size: 1.1rem;
  color: #e9f9ff;
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.4s ease;
}

.photo-message.show {
  opacity: 1;
  transform: scale(1);
}

/* Card */
.card {
  background: rgba(255,255,255,0.18);
  border-radius: 22px;
  padding: 25px;
  max-width: 600px;
  margin: auto;
  backdrop-filter: blur(12px);
  box-shadow: 0 0 35px rgba(0,0,0,0.25);
}

.counter {
  font-size: 1.05rem;
  margin-bottom: 15px;
  color: #e9f9ff;
  text-shadow: 0 0 8px rgba(255,255,255,0.6);
}

.letter {
  font-size: clamp(1rem, 3.5vw, 1.15rem);
  line-height: 1.7;
  margin-bottom: 25px;
}

button {
  background: linear-gradient(45deg, #7fd7ff, #4da3ff);
  border: none;
  border-radius: 35px;
  padding: 14px 32px;
  font-size: 1.1rem;
  color: white;
  cursor: pointer;
  box-shadow: 0 0 18px #7fd7ff;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

button:hover {
  transform: scale(1.1);
  box-shadow: 0 0 28px #7fd7ff;
}

#secret {
  margin-top: 20px;
  font-size: 1.2rem;
  color: #e9f9ff;
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.5s ease;
}

#secret.show {
  opacity: 1;
  transform: scale(1);
}

/* Scratch card */
.scratch-container {
  margin-top: 25px;
}

.scratch-card {
  width: 260px;
  height: 110px;
  margin: auto;
  border-radius: 18px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(255,255,255,0.3);
  background: linear-gradient(45deg, #7fd7ff, #4da3ff);
}

.scratch-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  color: white;
  padding: 15px;
  text-align: center;
  opacity: 0;
}

.scratch-overlay {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    45deg,
    rgba(255,255,255,0.35),
    rgba(255,255,255,0.35) 8px,
    rgba(255,255,255,0.15) 8px,
    rgba(255,255,255,0.15) 16px
  );
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  color: white;
  cursor: pointer;
  user-select: none;
}

/* Mini game */
.game {
  margin-top: 25px;
  padding: 15px;
  background: rgba(255,255,255,0.12);
  border-radius: 16px;
}

.score {
  font-size: 1.1rem;
  margin-bottom: 10px;
}

.game-area {
  position: relative;
  height: 180px;
  border-radius: 14px;
  background: rgba(0,0,0,0.15);
  overflow: hidden;
}

.tap-heart {
  position: absolute;
  font-size: 26px;
  cursor: pointer;
  animation: pop 0.3s ease;
}

@keyframes pop {
  from { transform: scale(0.5); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* Music */
.music {
  margin-top: 25px;
  font-size: 0.95rem;
  opacity: 0.95;
  line-height: 1.6;
}

/* Confetti hearts */
.confetti {
  position: fixed;
  top: -20px;
  font-size: 18px;
  animation: confettiFall linear forwards;
  pointer-events: none;
}

@keyframes confettiFall {
  to {
    transform: translateY(120vh) rotate(720deg);
    opacity: 0;
  }
}

/* Lock screen */
.lock-screen {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #ff6fae, #ff3f6c);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.lock-box {
  background: rgba(255,255,255,0.18);
  padding: 28px;
  border-radius: 22px;
  width: 85%;
  max-width: 320px;
  backdrop-filter: blur(12px);
  box-shadow: 0 0 30px rgba(0,0,0,0.25);
}

.lock-title {
  font-size: 1.5rem;
  margin-bottom: 6px;
  text-shadow: 0 0 10px rgba(255,255,255,0.8);
}

.lock-sub {
  font-size: 0.95rem;
  opacity: 0.9;
  margin-bottom: 15px;
}

.lock-box input {
  width: 100%;
  padding: 10px 14px;
  border-radius: 12px;
  border: none;
  outline: none;
  font-size: 1rem;
  margin-bottom: 12px;
}

.lock-error {
  margin-top: 10px;
  font-size: 0.95rem;
  color: #ffe0e0;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.lock-error.show {
  opacity: 1;
}
</style>
</head>

<body>

<!-- LOCK SCREEN -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <div class="lock-title">💝 Valentine’s Surprise</div>
    <div class="lock-sub">Enter the password I gave you 💌</div>
    <input type="password" id="passwordInput" placeholder="Password...">
    <button onclick="checkPassword()">Unlock 💖</button>
    <div class="lock-error" id="lockError">Wrong password 😭</div>
  </div>
</div>

<div class="container" id="mainContent" style="display:none;">
  <div class="name" id="nameText" data-text="Alan 🩵"></div>
  <div class="countdown" id="countdownText"></div>

  <!-- PHOTO -->
  <div class="photo" onclick="photoSurprise()">
    <img src="us.png" alt="Us together XD 🩵🤍">
  </div>
  <div class="photo-message" id="photoMsg" data-text="This is my favorite picture because we're in it ^^ 💖"></div>

  <div class="card">

    <div class="counter" id="counterText"></div>

    <div class="letter" id="letterText" data-text="Dear Alan,

From the moment you came into my life, everything felt warmer, brighter,
and more alive. You make me feel safe, loved, and understood in ways
I never knew were possible.

I love how passionate you are... especially about games, music,
and being unapologetically yourself. Loving you is easy. I hope that today is filled with the same joy you bring into my life.

Your heart is fragile and sensitive just like mine, but I'm as careful as possible with it. Happy Valentine's Day! 💖"></div>

    <button onclick="unlockLove()">💘 Click for a secret</button>

    <div id="secret">
      <div id="secretText" data-text="🩵 Secret 🤍

All I need in this life is you and me. Oh, and WiFi. And wine. And snacks. But that’s it, I swear.
I’m yours. Sorry, no refunds or exchanges. I know loving me isn’t always the easiest. But trust me, I’m worth it. 💖"></div>
    </div>

    <!-- SCRATCH CARD -->
    <div class="scratch-container">
      <div style="margin-bottom:8px;">💌 Scratch to reveal</div>
      <div class="scratch-card" id="scratchCard">
        <div class="scratch-text" id="scratchText" data-text="I choose you. Always. 💖"></div>
        <div class="scratch-overlay" id="scratchOverlay">Scratch 💕</div>
      </div>
    </div>

    <!-- MINI GAME -->
    <div class="game">
      <div class="score">💝 Hearts collected: <span id="score">0</span></div>
      <div class="game-area" id="gameArea"></div>
    </div>

    <div class="music" id="musicText" data-text="🎵 Your favorite songs:

• Feel Alone — Juice WRLD
• Creepin' — Metro Boomin, The Weeknd & 21 Savage
• Castle — Clarx, Harddope
• Love The Way You Lie — Eminem & Rihanna
• Drivers License — Olivia Rodrigo"></div>

  </div>
</div>

<script>
// ===== PASSWORD =====
const correctPassword = "alan<3"; // change this to whatever you want

function checkPassword() {
  const input = document.getElementById("passwordInput").value;
  const error = document.getElementById("lockError");
  if (input === correctPassword) {
    document.getElementById("lockScreen").style.display = "none";
    document.getElementById("mainContent").style.display = "block";
    startTyping();
  } else {
    error.classList.add("show");
    setTimeout(() => error.classList.remove("show"), 1500);
  }
}

// ===== TYPEWRITER (SAFE — DOES NOT BREAK STYLES) =====
function typeWriter(el, speed = 18) {
  const text = el.dataset.text || "";
  el.textContent = "";
  let i = 0;
  const interval = setInterval(() => {
    el.textContent += text.charAt(i);
    i++;
    if (i >= text.length) clearInterval(interval);
  }, speed);
}

function startTyping() {
  typeWriter(document.getElementById("nameText"), 60);
  setTimeout(() => typeWriter(document.getElementById("letterText")), 400);
  setTimeout(() => typeWriter(document.getElementById("musicText")), 1600);
}

// ===== COUNTDOWN =====
const valentines = new Date(new Date().getFullYear(), 1, 14);

function updateCountdown() {
  const now = Date.now();
  const diff = valentines - now;

  if (diff <= 0) {
    document.getElementById("countdownText").textContent =
      "💖 Happy Valentine's Day, Alan! 💖";
    return;
  }

  const d = Math.floor(diff / 86400000);
  const h = Math.floor(diff / 3600000) % 24;
  const m = Math.floor(diff / 60000) % 60;
  const s = Math.floor(diff / 1000) % 60;

  document.getElementById("countdownText").textContent =
    `💘 Valentine’s Day in ${d}d ${h}h ${m}m ${s}s 💘`;
}

setInterval(updateCountdown, 1000);
updateCountdown();

// ===== TOGETHER COUNTER =====
const startDate = new Date("2024-06-01T00:00:00"); // change to your real date

function updateCounter() {
  const now = Date.now();
  const diff = now - startDate;

  const s = Math.floor(diff / 1000) % 60;
  const m = Math.floor(diff / 60000) % 60;
  const h = Math.floor(diff / 3600000) % 24;
  const d = Math.floor(diff / 86400000);

  document.getElementById("counterText").textContent =
    `💞 Together for ${d} days, ${h} hours, ${m} minutes, ${s} seconds 🩵`;
}

setInterval(updateCounter, 1000);
updateCounter();

// ===== SECRET BUTTON =====
function unlockLove() {
  const secret = document.getElementById("secret");
  if (!secret.classList.contains("show")) {
    secret.classList.add("show");
    typeWriter(document.getElementById("secretText"));
    burstHearts();
    confettiHearts();
  }
}

// ===== PHOTO MESSAGE =====
function photoSurprise() {
  const msg = document.getElementById("photoMsg");
  if (!msg.classList.contains("show")) {
    msg.classList.add("show");
    typeWriter(msg);
    confettiHearts();
  } else {
    msg.classList.remove("show");
  }
}

// ===== FLOATING HEART BACKGROUND =====
setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💖";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 20 + 16 + "px";
  heart.style.animationDuration = Math.random() * 3 + 4 + "s";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 7000);
}, 300);

// ===== BURST HEARTS =====
function burstHearts() {
  for (let i = 0; i < 25; i++) {
    const heart = document.createElement("div");
    heart.innerHTML = "🩵";
    heart.style.position = "fixed";
    heart.style.left = "50%";
    heart.style.top = "50%";
    heart.style.fontSize = Math.random() * 18 + 16 + "px";
    heart.style.transform = "translate(-50%, -50%)";
    heart.style.transition = "all 1s ease";
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.top = Math.random() * 100 + "vh";
      heart.style.opacity = "0";
    }, 50);

    setTimeout(() => heart.remove(), 1200);
  }

  if (navigator.vibrate) navigator.vibrate(80);
}

// ===== CONFETTI HEARTS =====
function confettiHearts() {
  for (let i = 0; i < 40; i++) {
    const heart = document.createElement("div");
    heart.className = "confetti";
    heart.innerHTML = ["💝","🩵","💘","🤍"][Math.floor(Math.random()*4)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 16 + 14 + "px";
    heart.style.animationDuration = Math.random() * 2 + 2 + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 3000);
  }
}

// ===== SCRATCH CARD =====
const overlay = document.getElementById("scratchOverlay");
const scratchText = document.getElementById("scratchText");
let scratched = false;

document.getElementById("scratchCard").addEventListener("pointerdown", () => {
  if (scratched) return;
  scratched = true;
  overlay.style.opacity = "0";
  scratchText.style.opacity = "1";
  setTimeout(() => typeWriter(scratchText), 400);
  flowerConfetti();
});

// ===== FLOWER CONFETTI =====
function flowerConfetti() {
  for (let i = 0; i < 40; i++) {
    const flower = document.createElement("div");
    flower.className = "confetti";
    flower.innerHTML = ["🌸","🌺","🌷","💐","🌹"][Math.floor(Math.random()*5)];
    flower.style.left = Math.random() * 100 + "vw";
    flower.style.fontSize = Math.random() * 18 + 14 + "px";
    flower.style.animationDuration = Math.random() * 2 + 2 + "s";
    document.body.appendChild(flower);
    setTimeout(() => flower.remove(), 3000);
  }
}

// ===== MINI GAME =====
let score = 0;
const gameArea = document.getElementById("gameArea");

function spawnHeart() {
  const heart = document.createElement("div");
  heart.className = "tap-heart";
  heart.innerHTML = "💝";
  heart.style.left = Math.random() * 85 + "%";
  heart.style.top = Math.random() * 75 + "%";

  heart.onclick = () => {
    score++;
    document.getElementById("score").textContent = score;
    heart.remove();
    burstHearts();
  };

  gameArea.appendChild(heart);

  setTimeout(() => {
    if (heart.parentNode) heart.remove();
  }, 2000);
}

setInterval(spawnHeart, 800);
</script>

</body>
</html>
